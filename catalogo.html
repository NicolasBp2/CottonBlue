<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catálogo - Cotton Blue Shop</title>

    <meta
        name="description"
        content="Explora el catálogo de Cotton Blue Shop y encuentra los productos disponibles por género, categoría, destacados y ofertas."
    >

    <meta
        property="og:title"
        content="Catálogo - Cotton Blue Shop"
    >

    <meta
        property="og:description"
        content="Explora el catálogo de Cotton Blue Shop y descubre los productos disponibles."
    >

    <meta
        property="og:type"
        content="website"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="img/logo.svg"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
            aria-label="Cotton Blue Shop"
        >
            <img
                src="img/logo.svg"
                alt="Cotton Blue Shop"
                class="logo-imagen"
            >
        </a>


        <nav
            class="menu"
            id="menu-principal"
        >

            <!-- HOMBRE -->

            <div class="menu-item">

                <a href="catalogo.html?filtro=hombre">
                    Hombre
                </a>

                <div class="mega-menu">

                    <div
                        class="mega-menu-columna"
                        id="navbar-categorias-hombre"
                    >
                        <h5>Ropa</h5>
                    </div>


                    <div class="mega-menu-columna">

                        <h5>
                            Colecciones
                        </h5>

                        <a href="catalogo.html?filtro=hombre-destacados">
                            Destacados
                        </a>

                        <a href="catalogo.html?filtro=hombre-ofertas">
                            Ofertas
                        </a>

                    </div>

                </div>

            </div>


            <!-- MUJER -->

            <div class="menu-item">

                <a href="catalogo.html?filtro=mujer">
                    Mujer
                </a>

                <div class="mega-menu">

                    <div
                        class="mega-menu-columna"
                        id="navbar-categorias-mujer"
                    >
                        <h5>Ropa</h5>
                    </div>


                    <div class="mega-menu-columna">

                        <h5>
                            Colecciones
                        </h5>

                        <a href="catalogo.html?filtro=mujer-destacados">
                            Destacados
                        </a>

                        <a href="catalogo.html?filtro=mujer-ofertas">
                            Ofertas
                        </a>

                    </div>

                </div>

            </div>


            <a href="catalogo.html?filtro=destacados">
                Destacados
            </a>

            <a href="catalogo.html?filtro=ofertas">
                Ofertas
            </a>

        </nav>


        <div class="acciones">

            <button
                type="button"
                onclick="toggleBuscador()"
            >
                Buscar
            </button>

            <a
                href="carrito.html"
                class="btn-carrito"
            >
                Carrito

                <span
                    class="carrito-contador"
                    id="carrito-contador"
                >
                    0
                </span>
            </a>

        </div>


        <button
            type="button"
            class="menu-hamburguesa"
            onclick="toggleMenuMovil()"
            aria-label="Abrir menú"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <div
        class="buscador-barra"
        id="buscador-barra"
    >

        <input
            type="text"
            id="buscador-input"
            placeholder="Buscar productos..."
            oninput="filtrarBusqueda()"
        >

        <button
            type="button"
            onclick="toggleBuscador()"
        >
            Cerrar
        </button>

    </div>


    <main>

        <section class="productos">

            <section class="catalogo-seccion contenedor">

                <h2>
                    Catálogo completo
                </h2>


                <div class="catalogo-layout">

                    <aside class="filtros-lateral">

                        <h4>
                            Categorías
                        </h4>


                        <button
                            type="button"
                            class="filtro filtro-activo"
                            data-filtro="todos"
                        >
                            Todos
                        </button>


                        <details class="filtro-grupo">

                            <summary>
                                Hombre
                            </summary>

                            <div
                                class="subfiltros"
                                id="subfiltros-hombre"
                            >
                            </div>

                        </details>


                        <details class="filtro-grupo">

                            <summary>
                                Mujer
                            </summary>

                            <div
                                class="subfiltros"
                                id="subfiltros-mujer"
                            >
                            </div>

                        </details>


                        <details class="filtro-grupo">

                            <summary>
                                Unisex
                            </summary>

                            <div
                                class="subfiltros"
                                id="subfiltros-unisex"
                            >
                            </div>

                        </details>


                        <button
                            type="button"
                            class="filtro"
                            data-filtro="ofertas"
                        >
                            Ofertas
                        </button>

                    </aside>


                    <div
                        class="productos-grid"
                        id="catalogo-productos"
                    >
                    </div>

                </div>

            </section>

        </section>

    </main>


    <footer class="footer-fondo">

        <div class="footer contenedor">

            <div class="footer-columna">

                <img
                    src="img/logo.svg"
                    alt="Cotton Blue Shop"
                    class="footer-logo"
                >

                <p>
                    Ropa para quienes buscan algo diferente.
                </p>

            </div>


            <div class="footer-columna">

                <h4>
                    Ayuda
                </h4>

                <a href="#">
                    Preguntas frecuentes
                </a>

                <a href="#">
                    Envíos
                </a>

                <a href="#">
                    Cambios y devoluciones
                </a>

            </div>


            <div class="footer-columna">

                <h4>
                    Contacto
                </h4>

                <a
                    href="https://wa.me/573126881081"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    WhatsApp
                </a>

                <a
                    href="https://www.instagram.com/cottonblue268/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

            </div>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>

    <script
        src="js/main.js"
        defer
    ></script>

</body>

</html>
