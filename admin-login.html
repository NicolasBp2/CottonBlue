<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administrador - Cotton Blue Shop
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <main class="admin-login">

        <section class="admin-login-card">

            <h1>
                Panel administrativo
            </h1>


            <p>
                Inicia sesión para administrar Cotton Blue Shop.
            </p>


            <form id="form-admin-login">

                <div class="admin-campo">

                    <label for="admin-email">
                        Correo
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="admin-campo">

                    <label for="admin-password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-boton"
                >
                    Iniciar sesión
                </button>


                <p
                    id="admin-login-mensaje"
                    class="admin-login-mensaje"
                ></p>

            </form>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
